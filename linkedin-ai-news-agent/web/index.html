<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI News Studio</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#fff; --text:#151a2c; --muted:#6a7288; --line:#e3e7f1;
  --brand:#0a66c2; --brand-ink:#fff; --ok:#12805c; --warn:#b26a00; --bad:#c0392b;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1220;--surface:#171c2e;--text:#eef1fb;--muted:#9aa3bd;--line:#262d45;
        --brand:#4da3ff;--brand-ink:#06121f;--ok:#4cc9a0;--warn:#f0b35a;--bad:#ff7b6b;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7a5cff);
  display:grid;place-items:center;color:#fff;font-weight:700}
h1{font-size:17px;margin:0}
.sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);padding:8px 14px;transition:.15s}
button:hover{border-color:var(--brand)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.danger{color:var(--bad)}
main{display:grid;grid-template-columns:340px 1fr;gap:20px;max-width:1200px;margin:20px auto;padding:0 16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:99px;font-size:13px;background:transparent}
.tab.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.list{max-height:70vh;overflow:auto}
.item{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.sel{background:color-mix(in srgb,var(--brand) 8%,transparent)}
.item img,.item .ph{width:64px;height:34px;border-radius:6px;object-fit:cover;background:var(--line);flex:none}
.item b{display:block;font-size:14px;line-height:1.3}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;margin-top:4px;
  background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:600}
.drafted{--c:var(--warn)}.published{--c:var(--ok)}.skipped{--c:var(--muted)}.approved{--c:var(--brand)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}
@media(max-width:1000px){.editor{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
textarea{width:100%;min-height:340px;resize:vertical;font:inherit;line-height:1.55;padding:12px;
  border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea:focus{outline:2px solid var(--brand);border-color:transparent}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.count.over{color:var(--bad)}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.card .who{display:flex;gap:10px;align-items:center;padding:12px}
.card .av{width:40px;height:40px;border-radius:8px;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;font-weight:700}
.card .body{padding:0 12px 12px;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.card img{width:100%;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 20px;align-items:center}
.note{padding:12px 20px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);opacity:0;visibility:hidden;background:var(--text);
  color:var(--bg);padding:10px 18px;border-radius:99px;transition:.25s;font-size:14px;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
</style>
</head>
<body>
<header>
  <div class="logo">AI</div>
  <div><h1>AI News Studio</h1><div class="sub">YouTube to LinkedIn, with your approval</div></div>
  <div class="spacer"></div>
  <button id="demo">Try demo</button>
  <button id="run" class="primary">Generate drafts</button>
</header>
<main>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </section>
  <section class="panel" id="detail"><div class="empty">Select a draft to review it.</div></section>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let drafts = [], sel = null, filter = "drafted";
const FILTERS = ["drafted","published","skipped","all"];

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3200)}
async function api(path, method="GET", body){
  const r = await fetch(path,{method,headers:{"Content-Type":"application/json"},
    body: body?JSON.stringify(body):undefined});
  return {ok:r.ok, data: await r.json().catch(()=>({}))};
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(keep){
  drafts = (await api("/api/drafts")).data;
  if(!keep || !drafts.find(d=>d.id===sel)) sel = (visible()[0]||{}).id || null;
  render();
}
const visible = () => drafts.filter(d => filter==="all" || d.status===filter);

function render(){
  $("#tabs").innerHTML = FILTERS.map(f=>{
    const n = f==="all"?drafts.length:drafts.filter(d=>d.status===f).length;
    return `<button class="tab ${f===filter?"on":""}" data-f="${f}">${f} ${n}</button>`}).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{filter=b.dataset.f;sel=(visible()[0]||{}).id||null;render()});
  const v = visible();
  $("#list").innerHTML = v.length ? v.map(d=>`
    <div class="item ${d.id===sel?"sel":""}" data-id="${d.id}">
      ${d.has_image?`<img src="/api/drafts/${d.id}/image" alt="">`:`<div class="ph"></div>`}
      <div><b>${esc(d.title)}</b><span class="badge ${d.status}">${d.status}</span></div>
    </div>`).join("")
    : `<div class="empty">Nothing here yet.<br>Click <b>Generate drafts</b> or <b>Try demo</b>.</div>`;
  document.querySelectorAll(".item").forEach(i=>i.onclick=()=>{sel=i.dataset.id;render()});
  renderDetail();
}

function renderDetail(){
  const d = drafts.find(x=>x.id===sel);
  if(!d){$("#detail").innerHTML=`<div class="empty">Select a draft to review it.</div>`;return}
  const editable = d.status==="drafted";
  $("#detail").innerHTML = `
    <div class="editor">
      <div>
        <label>Post text</label>
        <textarea id="text" ${editable?"":"readonly"}>${esc(d.text)}</textarea>
        <div class="count" id="count"></div>
      </div>
      <div>
        <label>Preview</label>
        <div class="card">
          <div class="who"><div class="av">Co</div><div><b>Your company</b><div class="sub">Just now</div></div></div>
          <div class="body" id="prev"></div>
          ${d.has_image?`<img src="/api/drafts/${d.id}/image?${Date.now()}" alt="">`:""}
        </div>
      </div>
    </div>
    <div class="actions">
      ${editable?`<button class="primary" id="approve">Approve and publish</button>
                  <button id="save">Save edits</button>
                  <button class="danger" id="skip">Skip</button>`:""}
      <button id="copy">Copy text</button>
      ${d.has_image?`<a href="/api/drafts/${d.id}/image" download="${d.id}.png"><button>Download image</button></a>`:""}
      <a href="${esc(d.url)}" target="_blank" rel="noopener"><button>Open video</button></a>
    </div>
    <div class="note">Not connected to LinkedIn yet? Use <b>Copy text</b> and <b>Download image</b> and post it by hand.</div>`;
  const ta = $("#text");
  const upd = () => {$("#prev").textContent = ta.value;
    $("#count").textContent = ta.value.length+" / 3000"; $("#count").className="count"+(ta.value.length>3000?" over":"")};
  ta.oninput = upd; upd();
  $("#copy").onclick = async()=>{await navigator.clipboard.writeText(ta.value);toast("Copied")};
  if(editable){
    $("#save").onclick = async()=>{await api("/api/drafts/"+d.id,"POST",{text:ta.value});toast("Saved");load(true)};
    $("#skip").onclick = async()=>{await api("/api/drafts/"+d.id+"/skip","POST");toast("Skipped");load()};
    $("#approve").onclick = async e=>{
      if(!confirm("Publish this post to your LinkedIn company page?")) return;
      e.target.disabled = true;
      await api("/api/drafts/"+d.id,"POST",{text:ta.value});
      const r = await api("/api/drafts/"+d.id+"/approve","POST");
      toast(r.ok ? "Published to LinkedIn" : "Could not publish: "+(r.data.error||"unknown error"));
      e.target.disabled = false; load(true);
    };
  }
}

$("#run").onclick = async e=>{
  e.target.disabled=true; e.target.textContent="Working...";
  const r = await api("/api/run","POST");
  toast(r.ok ? `${r.data.made} new draft(s)` : "Failed: "+(r.data.error||"check your .env keys"));
  e.target.disabled=false; e.target.textContent="Generate drafts"; load();
};
$("#demo").onclick = async()=>{await api("/api/demo","POST");toast("Demo draft added");load()};
load();
</script>
</body>
</html>
