<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>AI News Studio</title>
<style>
/* Poppins is self-hosted (SIL OFL) so it works offline */
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url(/static/fonts/poppins-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;src:url(/static/fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url(/static/fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;src:url(/static/fonts/poppins-latin-700-normal.woff2) format('woff2')}
/* Bento grid: flat tiles, thin borders, bold accent colours */
:root{
  --bg:#f3f4f8; --card:#ffffff; --line:#e4e6ee; --text:#161a2e; --muted:#667090;
  --accent:#4f46e5; --accent-soft:#eceafd; --accent-ink:#ffffff;
  --amber:#b45309; --amber-soft:#fef3dc; --green:#047857; --green-soft:#dcf5ec; --gray:#5b6477; --gray-soft:#e9ebf1;
  --bad:#c0352b; --r:18px; --nav:232px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1020;--card:#161a2e;--line:#262c47;--text:#eef0fb;--muted:#9aa3c4;
        --accent:#8b83ff;--accent-soft:#25244d;--accent-ink:#0d1020;
        --amber:#f6bf6b;--amber-soft:#3a2d17;--green:#58d6a8;--green-soft:#15352c;--gray:#aab2cc;--gray-soft:#242a41;--bad:#ff8a7c}
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:clamp(14px,1.5vw,15px);line-height:1.6;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh;min-height:100dvh}

/* nav rail */
nav{position:sticky;top:0;height:100vh;padding:22px 16px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;
  background:var(--accent);color:var(--accent-ink)}
.brand b{display:block;font-weight:600;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:12px;
  background:transparent;color:var(--muted);cursor:pointer;font-weight:500;text-align:left;transition:.15s}
.nav-btn:hover{background:var(--bg);color:var(--text)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .n{margin-left:auto;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--bg);color:var(--text)}
.nav-btn.on .n{background:var(--accent);color:var(--accent-ink)}
.nav-btn svg{width:20px;height:20px;flex:none}
.grow{flex:1}
.tip{padding:14px;border-radius:14px;background:var(--bg);font-size:12px;color:var(--muted)}

/* content */
.content{padding:clamp(16px,3vw,34px);display:grid;gap:clamp(14px,2vw,22px);align-content:start;min-width:0}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top h2{font-size:clamp(20px,3vw,26px);font-weight:600;flex:1;min-width:180px}
.top h2 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}

.btn{border:1px solid var(--line);cursor:pointer;min-height:44px;padding:0 20px;border-radius:12px;background:var(--card);
  font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text);
  transition:transform .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad)}

/* bento */
.bento{display:grid;gap:clamp(14px,2vw,22px);grid-template-columns:repeat(12,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2vw,24px);min-width:0}
.tile h3{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.stat{grid-column:span 4;display:flex;align-items:center;gap:16px}
.stat .num{font-size:clamp(30px,4vw,42px);font-weight:700;line-height:1}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .dot{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin-left:auto;background:var(--c-soft);color:var(--c)}
.stat .dot svg{width:24px;height:24px}
.s-drafted{--c:var(--amber);--c-soft:var(--amber-soft)}
.s-published{--c:var(--green);--c-soft:var(--green-soft)}
.s-skipped{--c:var(--gray);--c-soft:var(--gray-soft)}

.queue{grid-column:span 3;grid-row:span 2}
.editor{grid-column:span 5}
.preview{grid-column:span 4}
.actions{grid-column:4/-1;display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;align-items:center}
.actions h3,.actions .hint{flex:1 1 100%;margin:0}
.actions .btn{flex:1 1 150px}

.list{display:grid;gap:10px;max-height:62vh;overflow:auto;margin:-4px;padding:4px}
.item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card);
  cursor:pointer;text-align:left;width:100%;transition:.15s}
.item>span{min-width:0}
.item b{overflow-wrap:anywhere}
.by{display:block;font-size:11.5px;color:var(--muted)}
.src{display:flex;gap:8px;align-items:center;margin:-4px 0 14px;font-size:12.5px;color:var(--muted)}.src b{color:var(--text);font-weight:600}
.item:hover{border-color:var(--accent)}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.thumb{width:56px;height:32px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
.item b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.badge{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:0 10px;border-radius:99px;color:var(--c);background:var(--c-soft)}
.drafted{--c:var(--amber);--c-soft:var(--amber-soft)}.published{--c:var(--green);--c-soft:var(--green-soft)}.skipped{--c:var(--gray);--c-soft:var(--gray-soft)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.empty .ico{font-size:30px;margin-bottom:8px}

textarea{width:100%;min-height:clamp(220px,38vh,360px);resize:vertical;padding:16px;border-radius:14px;border:1px solid var(--line);
  background:var(--bg);line-height:1.65}
textarea:focus{border-color:var(--accent);outline:3px solid var(--accent-soft)}
textarea:read-only{opacity:.85}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:8px}
.count.over{color:var(--bad);font-weight:600}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.who{display:flex;gap:12px;align-items:center;padding:14px}
.av{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink)}
.who b{font-weight:600;font-size:14px;display:block;line-height:1.2}
.who span{font-size:11px;color:var(--muted)}
.body{padding:0 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.card img{width:100%;display:block}
.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field input,.field textarea.sm{width:100%;min-height:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:inherit;line-height:1.5}
.field input:focus,.field textarea.sm:focus{border-color:var(--accent);outline:3px solid var(--accent-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row .btn{flex:1 1 140px;min-height:40px;padding:0 14px}
.mtabs{display:none}
.imgstat{margin-top:12px;padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:500}
.imgstat.ok{background:var(--green-soft);color:var(--green)}.imgstat.warn{background:var(--amber-soft);color:var(--amber)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;visibility:hidden;padding:12px 22px;
  border-radius:99px;background:var(--text);color:var(--bg);font-weight:500;transition:.25s;max-width:90vw;z-index:30;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

/* responsive */
@media(max-width:1280px){
  .queue{grid-column:span 5;grid-row:auto}.editor{grid-column:span 7}
  .preview{grid-column:span 7}.actions{grid-column:span 5}
}
@media(max-width:980px){
  .queue,.editor,.preview,.actions{grid-column:1/-1}
  .actions{flex-direction:row;flex-wrap:wrap}.actions h3,.actions .hint{flex:1 1 100%}.actions .btn{flex:1 1 calc(50% - 5px)}
  .list{max-height:none}
}
@media(max-width:820px),(max-height:500px) and (max-width:1000px){
  .app{grid-template-columns:1fr}
  nav{position:fixed;inset:auto 0 0 0;height:auto;z-index:20;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
      border-right:0;border-top:1px solid var(--line);gap:4px}
  .brand,.grow,.tip{display:none}
  .nav-btn{flex-direction:column;gap:2px;justify-content:center;padding:6px 4px;font-size:11px;min-height:54px;text-align:center}
  .nav-btn .n{margin:0;padding:0 7px;font-size:10px}
  .content{padding-bottom:100px}
  .stat{padding:14px;gap:8px}.stat .dot{display:none}.stat .num{font-size:28px}.stat .lbl{font-size:12px}
}
@media(min-width:821px) and (max-width:1100px){.stat .dot{width:40px;height:40px}}
@media(max-width:520px){.top .btn{flex:1}.stat{padding:12px}}

/* ---- phone: tabs, swipeable queue, no iOS zoom, safe areas ---- */
@media(max-width:820px),(max-height:500px) and (max-width:1000px){
  .content{padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
  nav{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .top h2{flex:1 1 100%;font-size:22px}.top h2 small{display:none}
  .top .btn{flex:1}
  textarea,.field input,.field textarea.sm{font-size:16px}      /* stops iOS zooming on focus */
  textarea{min-height:46vh}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom))}

  .list{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;-webkit-overflow-scrolling:touch;
        max-height:none;margin:-4px -14px;padding:4px 14px;scrollbar-width:none}
  .list::-webkit-scrollbar{display:none}
  .item{flex:0 0 82%;scroll-snap-align:start;width:auto}
  .item:only-child{flex-basis:100%}
  .empty{flex:1}

  .mtabs{display:grid;grid-column:1/-1;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;position:sticky;top:0;z-index:6;
         background:var(--card);border:1px solid var(--line);border-radius:14px}
  .mtabs button{border:0;background:transparent;min-height:42px;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer}
  .mtabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #bento[data-mtab="text"] :is(.preview,.actions),
  #bento[data-mtab="preview"] :is(.editor,.actions),
  #bento[data-mtab="actions"] :is(.editor,.preview){display:none}
  .actions .btn:first-of-type{flex:1 1 100%}
}
@media(max-height:500px) and (max-width:1000px){          /* phone in landscape */
  nav{padding-top:4px}.nav-btn{flex-direction:row;min-height:44px;justify-content:center;gap:8px}
  .content{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(64px + env(safe-area-inset-bottom))}
  textarea{min-height:60vh}
}
@media(max-width:360px){.stat .num{font-size:24px}.stat{padding:10px}.nav-btn{font-size:10.5px}.btn{padding:0 12px}}
@media(hover:none){.btn:hover,.item:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Sections" id="nav"></nav>
  <div class="content">
    <div class="top">
      <h2>Content queue<small id="subtitle">YouTube to LinkedIn, with your approval</small></h2>
      <button class="btn" id="demo">Try demo</button>
      <button class="btn primary" id="run">Generate drafts</button>
    </div>
    <section class="bento" id="bento"></section>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const PHONE = matchMedia("(max-width:820px),(max-height:500px) and (max-width:1000px)");
let drafts = [], sel = null, filter = "drafted", company = "Your company", mtab = "text";
const ICON = {
  drafted:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  published:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 11-5.9-9.1"/><path d="M22 4L12 14l-3-3"/></svg>',
  skipped:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></svg>',
  all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'
};
const NAMES = {drafted:"To review", published:"Published", skipped:"Skipped", all:"All"};
const FILTERS = Object.keys(NAMES);
const count = f => f==="all"?drafts.length:drafts.filter(d=>d.status===f).length;
const visible = () => drafts.filter(d => filter==="all" || d.status===filter);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3400)}
async function api(path, method="GET", body){
  const r = await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  return {ok:r.ok, data: await r.json().catch(()=>({}))};
}
async function load(keep){
  drafts = (await api("/api/drafts")).data;
  if(!keep || !drafts.find(d=>d.id===sel)) sel = (visible()[0]||{}).id || null;
  render();
}

function renderNav(){
  $("#nav").innerHTML = `
    <div class="brand"><div class="logo">AI</div><div><b>News Studio</b><span>${esc(company)}</span></div></div>
    ${FILTERS.map(f=>`<button class="nav-btn ${f===filter?"on":""}" data-f="${f}" aria-current="${f===filter}">
      ${ICON[f]}<span>${NAMES[f]}</span><span class="n">${count(f)}</span></button>`).join("")}
    <div class="grow"></div>
    <div class="tip">Edit the text, check the preview, then approve. Nothing posts without your click.</div>`;
  document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{
    filter=b.dataset.f; sel=(visible()[0]||{}).id||null; render(); scrollTo({top:0,behavior:"smooth"})});
}

function render(){
  renderNav();
  const d = drafts.find(x=>x.id===sel);
  const stats = ["drafted","published","skipped"].map(s=>`
    <div class="tile stat s-${s}"><div><div class="num">${count(s)}</div><div class="lbl">${NAMES[s]}</div></div>
    <div class="dot">${ICON[s]}</div></div>`).join("");
  const v = visible();
  const list = v.length ? v.map(x=>`
    <button class="item ${x.id===sel?"sel":""}" data-id="${x.id}">
      ${x.has_image?`<img class="thumb" src="/api/drafts/${x.id}/image" alt="">`:`<div class="thumb"></div>`}
      <span><b>${esc(x.title)}</b><span class="by">${esc(x.channel)}</span><span class="badge ${x.status}">${NAMES[x.status]||x.status}</span></span>
    </button>`).join("")
    : `<div class="empty"><div class="ico">&#10024;</div>Nothing here yet.<br>Click <b>Generate drafts</b> or <b>Try demo</b>.</div>`;
  const queue = `<div class="tile queue"><h3>${NAMES[filter]} (${v.length})</h3><div class="list">${list}</div></div>`;
  const tabs = d ? `<div class="tile mtabs" role="tablist">${[["text","Text"],["preview","Preview"],["actions","Actions"]]
    .map(([k,l])=>`<button role="tab" data-t="${k}" class="${k===mtab?"on":""}" aria-selected="${k===mtab}">${l}</button>`).join("")}</div>` : "";
  $("#bento").innerHTML = stats + queue + tabs + (d ? detailTiles(d) :
    `<div class="tile editor" style="grid-column:span 9"><div class="empty"><div class="ico">&#128221;</div>Select a draft to review it.</div></div>`);
  $("#bento").dataset.mtab = mtab;
  document.querySelectorAll(".mtabs button").forEach(b=>b.onclick=()=>{     // no re-render: keeps unsaved edits
    mtab = b.dataset.t; $("#bento").dataset.mtab = mtab;
    document.querySelectorAll(".mtabs button").forEach(x=>{const on=x.dataset.t===mtab;x.classList.toggle("on",on);x.setAttribute("aria-selected",on)});
    $(".mtabs").scrollIntoView({block:"nearest"});
  });
  document.querySelectorAll(".item").forEach(i=>i.onclick=()=>{sel=i.dataset.id;mtab="text";render();
    if(PHONE.matches) $(".mtabs").scrollIntoView({behavior:"smooth",block:"start"});
    else if(innerWidth<=980) $(".editor").scrollIntoView({behavior:"smooth",block:"start"})});
  if(d) wire(d);
}

function detailTiles(d){
  const editable = d.status==="drafted";
  const initials = company.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return `
    <div class="tile editor"><h3>Post text</h3>
      <textarea id="text" aria-label="Post text" ${editable?"":"readonly"}>${esc(d.text)}</textarea>
      <div class="count" id="count"></div></div>
    <div class="tile preview"><h3>LinkedIn preview</h3>
      <div class="src">&#9654; Source channel: <b>${esc(d.channel)}</b></div>
      <div class="card">
        <div class="who"><div class="av">${esc(initials)}</div><div><b>${esc(company)}</b><span>Just now</span></div></div>
        <div class="body" id="prev"></div>
        ${d.has_image?`<img src="/api/drafts/${d.id}/image?${Date.now()}" alt="Post image">`:""}
      </div>
      <div class="imgstat ${d.card.bg&&d.card.bg!=="gradient"?"ok":"warn"}" id="imgstat">${
        d.card.bg&&d.card.bg!=="gradient" ? "&#10003; AI image made by "+esc(d.card.bg)
        : "&#9888; No AI background yet. Click <b>New AI background</b>."}</div>
      ${editable?`
      <div class="field"><label for="ctitle">Image title</label>
        <input id="ctitle" maxlength="80" value="${esc(d.card.title)}"></div>
      <div class="field"><label for="cdesc">Image description</label>
        <textarea class="sm" id="cdesc" rows="2" maxlength="160">${esc(d.card.description)}</textarea></div>
      <div class="row"><button class="btn" id="img-update">Update image text</button>
        <button class="btn" id="img-new">New AI background</button></div>`:""}
    </div>
    <div class="tile actions"><h3>Actions</h3>
      ${editable?`<button class="btn primary" id="approve">Approve and publish</button>
                  <button class="btn" id="save">Save edits</button>`:""}
      <button class="btn" id="copy">Copy text</button>
      ${d.has_image?`<a class="btn" href="/api/drafts/${d.id}/image" download="${d.id}.png">Download image</a>`:""}
      <a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">Open video</a>
      ${editable?`<button class="btn danger" id="skip">Skip this one</button>`:""}
      <div class="hint">No LinkedIn link yet? Copy the text, download the image, and post by hand.</div>
    </div>`;
}

function wire(d){
  const editable = d.status==="drafted", ta = $("#text");
  const upd = () => {$("#prev").textContent = ta.value;
    $("#count").textContent = ta.value.length+" / 3000"; $("#count").className="count"+(ta.value.length>3000?" over":"")};
  ta.oninput = upd; upd();
  $("#copy").onclick = async()=>{try{await navigator.clipboard.writeText(ta.value);toast("Copied to clipboard")}catch{toast("Copy failed")}};
  if(!editable) return;
  const regen = async(newBg, btn)=>{
    btn.disabled=true; const old=btn.textContent; btn.textContent="Working...";
    await api("/api/drafts/"+d.id+"/image","POST",{title:$("#ctitle").value,description:$("#cdesc").value,new_background:newBg});
    const c=(await api("/api/drafts")).data.find(x=>x.id===d.id);
    toast(c&&c.card.bg&&c.card.bg!=="gradient" ? "AI image ready ("+c.card.bg+")" : "Image updated, but no AI background could be made"); load(true);
  };
  $("#img-update").onclick = e=>regen(false, e.currentTarget);
  $("#img-new").onclick = e=>regen(true, e.currentTarget);
  $("#save").onclick = async()=>{await api("/api/drafts/"+d.id,"POST",{text:ta.value});toast("Saved");load(true)};
  $("#skip").onclick = async()=>{await api("/api/drafts/"+d.id+"/skip","POST");toast("Skipped");load()};
  $("#approve").onclick = async e=>{
    if(!confirm("Publish this post to your LinkedIn company page?")) return;
    e.currentTarget.disabled = true;
    await api("/api/drafts/"+d.id,"POST",{text:ta.value});
    const r = await api("/api/drafts/"+d.id+"/approve","POST");
    toast(r.ok ? "Published to LinkedIn" : "Could not publish: "+(r.data.error||"unknown error"));
    load(true);
  };
}

$("#run").onclick = async e=>{
  const b=e.currentTarget; b.disabled=true; b.textContent="Working...";
  const r = await api("/api/run","POST");
  toast(r.ok ? `${r.data.made} new draft(s)` : "Failed: "+(r.data.error||"check your .env keys"));
  b.disabled=false; b.textContent="Generate drafts"; load();
};
$("#demo").onclick = async()=>{await api("/api/demo","POST");toast("Demo draft added");filter="drafted";load()};
api("/api/config").then(r=>{if(r.ok) company=r.data.company}).finally(()=>load());
</script>
</body>
</html>
