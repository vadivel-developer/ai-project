<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI News Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Neumorphism (soft UI): one surface colour, two opposing shadows */
:root{
  --bg:#e4e9f2; --hi:#ffffff; --lo:#bcc5d8;
  --text:#27304d; --muted:#5b6585;
  --accent:#3a5bd9; --accent2:#6a4ff0; --accent-ink:#ffffff;
  --ok:#0f7a58; --warn:#a85d00; --bad:#c13a2c;
  --r:20px;
  --raise:9px 9px 20px var(--lo),-9px -9px 20px var(--hi);
  --raise-sm:5px 5px 11px var(--lo),-5px -5px 11px var(--hi);
  --inset:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1f2434;--hi:#2a3045;--lo:#141824;--text:#e8ecfa;--muted:#a0a9c6;
        --accent:#7c97ff;--accent2:#a48bff;--accent-ink:#0d1226;--ok:#4fd1a5;--warn:#f2b866;--bad:#ff8878}
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:clamp(14px,1.6vw,15px);line-height:1.6;min-height:100vh}
button,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.shell{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,32px);display:grid;gap:clamp(16px,2.5vw,28px)}

/* header */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;border-radius:var(--r);box-shadow:var(--raise)}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:var(--accent-ink);
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--raise-sm)}
.brand{flex:1;min-width:170px}
.brand h1{font-size:clamp(17px,2.4vw,21px);font-weight:600;line-height:1.2}
.brand p{font-size:12px;color:var(--muted)}
.hbtns{display:flex;gap:12px;flex-wrap:wrap}

/* buttons */
.btn{border:0;cursor:pointer;min-height:44px;padding:0 22px;border-radius:14px;background:var(--bg);
  font-weight:500;box-shadow:var(--raise-sm);transition:box-shadow .18s,transform .18s,opacity .18s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
a.btn{color:inherit}
.btn:hover{transform:translateY(-1px)}
.btn:active{box-shadow:var(--inset);transform:none}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font-weight:600}
.btn.primary:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.28)}
.btn.danger{color:var(--bad)}

/* layout */
main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:clamp(16px,2.5vw,28px);align-items:start}
.panel{border-radius:var(--r);box-shadow:var(--raise);padding:clamp(14px,2vw,22px)}

/* segmented filter */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;border-radius:16px;box-shadow:var(--inset);margin-bottom:18px}
.seg button{border:0;background:transparent;cursor:pointer;min-height:38px;padding:0 4px;border-radius:12px;
  font-size:12px;font-weight:500;color:var(--muted);text-transform:capitalize;transition:.18s}
.seg button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:var(--raise-sm)}
.seg small{opacity:.75;margin-left:3px}

/* list */
.list{display:grid;gap:14px;max-height:68vh;overflow:auto;padding:6px 8px 10px 6px;margin:-6px -8px -10px -6px}
.item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;cursor:pointer;background:var(--bg);
  border:0;text-align:left;width:100%;box-shadow:var(--raise-sm);transition:.18s}
.item.sel{box-shadow:var(--inset)}
.thumb{width:68px;height:38px;border-radius:9px;object-fit:cover;flex:none;box-shadow:var(--raise-sm);background:var(--lo)}
.item b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.badge{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:1px 10px;border-radius:99px;box-shadow:var(--inset);color:var(--c)}
.drafted{--c:var(--warn)}.published{--c:var(--ok)}.skipped{--c:var(--muted)}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.empty .ico{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:26px;box-shadow:var(--inset)}

/* editor */
.editor{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.5vw,26px)}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
textarea{width:100%;min-height:clamp(240px,42vh,380px);resize:vertical;border:0;border-radius:16px;padding:16px;
  background:var(--bg);box-shadow:var(--inset);line-height:1.65}
textarea:read-only{opacity:.85}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:8px}
.count.over{color:var(--bad);font-weight:600}
.card{border-radius:18px;box-shadow:var(--raise-sm);overflow:hidden;background:var(--bg)}
.who{display:flex;gap:12px;align-items:center;padding:14px}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;
  color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.who b{font-weight:600;font-size:14px;display:block;line-height:1.2}
.who span{font-size:11px;color:var(--muted)}
.body{padding:0 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.card img{width:100%;display:block}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.note{margin-top:20px;padding:14px 16px;border-radius:14px;box-shadow:var(--inset);font-size:12.5px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;visibility:hidden;
  padding:12px 22px;border-radius:99px;background:var(--bg);box-shadow:var(--raise);font-weight:500;
  transition:.25s;max-width:90vw;z-index:20;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

/* responsive */
@media(max-width:980px){.editor{grid-template-columns:1fr}}
@media(max-width:860px){main{grid-template-columns:1fr}.list{max-height:none}}
@media(max-width:520px){
  header{padding:12px 14px}
  .hbtns{width:100%}.hbtns .btn{flex:1}
  .actions .btn{flex:1 1 calc(50% - 6px);padding:0 12px}
  .seg button{font-size:11px}.seg small{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="logo">AI</div>
    <div class="brand"><h1>AI News Studio</h1><p>YouTube to LinkedIn, with your approval</p></div>
    <div class="hbtns">
      <button class="btn" id="demo">Try demo</button>
      <button class="btn primary" id="run">Generate drafts</button>
    </div>
  </header>
  <main>
    <section class="panel" aria-label="Drafts">
      <div class="seg" id="tabs" role="tablist"></div>
      <div class="list" id="list"></div>
    </section>
    <section class="panel" id="detail" aria-live="polite"></section>
  </main>
</div>
<div id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
let drafts = [], sel = null, filter = "drafted", company = "Your company";
const FILTERS = ["drafted","published","skipped","all"];

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3400)}
async function api(path, method="GET", body){
  const r = await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  return {ok:r.ok, data: await r.json().catch(()=>({}))};
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const visible = () => drafts.filter(d => filter==="all" || d.status===filter);

async function load(keep){
  drafts = (await api("/api/drafts")).data;
  if(!keep || !drafts.find(d=>d.id===sel)) sel = (visible()[0]||{}).id || null;
  render();
}

function render(){
  $("#tabs").innerHTML = FILTERS.map(f=>{
    const n = f==="all"?drafts.length:drafts.filter(d=>d.status===f).length;
    return `<button role="tab" aria-selected="${f===filter}" class="${f===filter?"on":""}" data-f="${f}">${f}<small>${n}</small></button>`}).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;sel=(visible()[0]||{}).id||null;render()});
  const v = visible();
  $("#list").innerHTML = v.length ? v.map(d=>`
    <button class="item ${d.id===sel?"sel":""}" data-id="${d.id}">
      ${d.has_image?`<img class="thumb" src="/api/drafts/${d.id}/image" alt="">`:`<div class="thumb"></div>`}
      <span><b>${esc(d.title)}</b><span class="badge ${d.status}">${d.status}</span></span>
    </button>`).join("")
    : `<div class="empty"><div class="ico">&#10024;</div>Nothing here yet.<br>Click <b>Generate drafts</b> or <b>Try demo</b>.</div>`;
  document.querySelectorAll(".item").forEach(i=>i.onclick=()=>{sel=i.dataset.id;render();
    if(innerWidth<=860) $("#detail").scrollIntoView({behavior:"smooth",block:"start"})});
  renderDetail();
}

function renderDetail(){
  const d = drafts.find(x=>x.id===sel);
  if(!d){$("#detail").innerHTML=`<div class="empty"><div class="ico">&#128221;</div>Select a draft to review it.</div>`;return}
  const editable = d.status==="drafted";
  const initials = company.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  $("#detail").innerHTML = `
    <div class="editor">
      <div>
        <label for="text">Post text</label>
        <textarea id="text" ${editable?"":"readonly"}>${esc(d.text)}</textarea>
        <div class="count" id="count"></div>
      </div>
      <div>
        <label>LinkedIn preview</label>
        <div class="card">
          <div class="who"><div class="av">${esc(initials)}</div><div><b>${esc(company)}</b><span>Just now</span></div></div>
          <div class="body" id="prev"></div>
          ${d.has_image?`<img src="/api/drafts/${d.id}/image?${Date.now()}" alt="Post image">`:""}
        </div>
      </div>
    </div>
    <div class="actions">
      ${editable?`<button class="btn primary" id="approve">Approve and publish</button>
                  <button class="btn" id="save">Save edits</button>
                  <button class="btn danger" id="skip">Skip</button>`:""}
      <button class="btn" id="copy">Copy text</button>
      ${d.has_image?`<a class="btn" href="/api/drafts/${d.id}/image" download="${d.id}.png">Download image</a>`:""}
      <a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">Open video</a>
    </div>
    <div class="note">Not connected to LinkedIn yet? Use <b>Copy text</b> and <b>Download image</b>, then post it by hand.</div>`;
  const ta = $("#text");
  const upd = () => {$("#prev").textContent = ta.value;
    $("#count").textContent = ta.value.length+" / 3000"; $("#count").className="count"+(ta.value.length>3000?" over":"")};
  ta.oninput = upd; upd();
  $("#copy").onclick = async()=>{try{await navigator.clipboard.writeText(ta.value);toast("Copied to clipboard")}catch{toast("Copy failed")}};
  if(editable){
    $("#save").onclick = async()=>{await api("/api/drafts/"+d.id,"POST",{text:ta.value});toast("Saved");load(true)};
    $("#skip").onclick = async()=>{await api("/api/drafts/"+d.id+"/skip","POST");toast("Skipped");load()};
    $("#approve").onclick = async e=>{
      if(!confirm("Publish this post to your LinkedIn company page?")) return;
      e.target.disabled = true;
      await api("/api/drafts/"+d.id,"POST",{text:ta.value});
      const r = await api("/api/drafts/"+d.id+"/approve","POST");
      toast(r.ok ? "Published to LinkedIn" : "Could not publish: "+(r.data.error||"unknown error"));
      load(true);
    };
  }
}

$("#run").onclick = async e=>{
  const b=e.currentTarget; b.disabled=true; b.textContent="Working...";
  const r = await api("/api/run","POST");
  toast(r.ok ? `${r.data.made} new draft(s)` : "Failed: "+(r.data.error||"check your .env keys"));
  b.disabled=false; b.textContent="Generate drafts"; load();
};
$("#demo").onclick = async()=>{await api("/api/demo","POST");toast("Demo draft added");filter="drafted";load()};
api("/api/config").then(r=>{if(r.ok) company=r.data.company}).finally(()=>load());
</script>
</body>
</html>
